<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eventos de Trade</title>
  <meta name="description" content="Confirmá tu asistencia a los eventos de Trade, mirá las fechas y las fotos.">
  <meta name="theme-color" content="#121011">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Kalam:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="demo-bar" id="demo-bar" hidden>
    Modo demo: las inscripciones y fotos se guardan solo en este navegador. Configurá
    <code>SCRIPT_URL</code> en <code>js/config.js</code> para usar Google Sheets.
  </div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="#">
        <span class="brand-name" id="site-name">Eventos de Trade</span>
        <span class="brand-tag" id="site-tag"></span>
      </a>
    </div>
  </header>

  <main class="wrap" id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="wrap" id="footer-text"></div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Foto ampliada">
    <button class="lb-close" type="button" id="lb-close" aria-label="Cerrar">×</button>
    <button class="lb-nav lb-prev" type="button" id="lb-prev" aria-label="Foto anterior">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-nav lb-next" type="button" id="lb-next" aria-label="Foto siguiente">›</button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/events.js"></script>
  <script src="js/cedula.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
